<div class="luxury-popup-container" aria-live="polite" aria-label="Notifications">
  @for (toast of notifications(); track toast.id) {
    <div class="luxury-toast" [ngClass]="'toast-' + toast.type" role="alert">
      <div class="toast-glow"></div>
      
      <div class="toast-icon-wrap">
        <span class="toast-icon">{{ getIcon(toast.type) }}</span>
      </div>

      <div class="toast-content">
        <strong class="toast-title">{{ toast.title }}</strong>
        <p class="toast-message">{{ toast.message }}</p>
      </div>

      <button type="button" class="toast-close-btn" (click)="close(toast.id)" aria-label="Close notification">
        ✕
      </button>

      <div class="toast-progress-bar" [style.animationDuration.ms]="toast.duration"></div>
    </div>
  }
</div>
