<section class="admin-auth-section">
  <div class="admin-auth-overlay"></div>

  <div class="admin-auth-container">
    <div class="admin-auth-card glass-card">
      
      <!-- Security Badge -->
      <div class="security-badge-pill">
        <span class="pulse-dot"></span>
        <span class="badge-text">Restricted Area • Executive Access Only</span>
      </div>

      <!-- Branding Header -->
      <div class="admin-brand-header">
        <div class="brand-crest">
          <span class="crest-shield">🛡️</span>
        </div>
        <h2>Vimahamur Portal</h2>
        <p>Management Gateway & Operations Dashboard</p>
      </div>

      @if (errorMessage()) {
        <div class="banner error-banner">
          ⚠️ {{ errorMessage() }}
        </div>
      }

      <!-- Admin Login Form -->
      <form class="admin-form" (ngSubmit)="submitLogin()">
        <label>
          <span>Administrator Email *</span>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              [(ngModel)]="credentials.email" 
              name="adminEmailVal" 
              placeholder="admin@example.com" 
              required 
              autocomplete="off" />
          </div>
        </label>

        <label>
          <span>Security Access Key *</span>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
              </svg>
            </span>
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              [(ngModel)]="credentials.password" 
              name="adminPasswordVal" 
              placeholder="••••••••••••" 
              required 
              autocomplete="new-password" />
            <button 
              type="button" 
              class="toggle-pwd-btn" 
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </label>

        <div class="form-options-row">
          <label class="remember-label">
            <input type="checkbox" [(ngModel)]="credentials.rememberMe" name="rememberMe" />
            <span>Keep session active</span>
          </label>
        </div>

        <button type="submit" class="btn-admin-submit" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <span class="btn-spinner"></span> Authenticating Security Key...
          } @else {
            Authorize & Access Portal ➔
          }
        </button>
      </form>

      <div class="portal-footer">
        <a routerLink="/" class="back-link">← Return to Public Website</a>
        <a routerLink="/login" class="customer-switch-link">Customer Sign In</a>
      </div>

    </div>
  </div>
</section>
